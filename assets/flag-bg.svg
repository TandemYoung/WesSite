<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <polygon id="star" points="1.5,0 1.85,1.01 2.93,1.04 2.07,1.69 2.38,2.71 1.5,2.10 0.62,2.71 0.93,1.69 0.07,1.04 1.15,1.01" fill="#FFFFFF"/>
    <pattern id="stars" x="1.17" y="3.89" width="5.33" height="10.77" patternUnits="userSpaceOnUse">
      <use href="#star" x="0" y="0"/>
    </pattern>
  </defs>
  <!-- Red base (becomes the red stripes between white) -->
  <rect width="80" height="100" fill="#B8202E"/>
  <!-- 6 white stripes -->
  <g fill="#FFFFFF">
    <rect y="7.69" width="80" height="7.69"/>
    <rect y="23.08" width="80" height="7.69"/>
    <rect y="38.46" width="80" height="7.69"/>
    <rect y="53.85" width="80" height="7.69"/>
    <rect y="69.23" width="80" height="7.69"/>
    <rect y="84.62" width="80" height="7.69"/>
  </g>
  <!-- Navy canton (top-left, 7 stripes tall, 40% wide) -->
  <rect width="32" height="53.85" fill="#0A2540"/>
  <!-- Stars (30 total, 6 cols x 5 rows) -->
  <rect width="32" height="53.85" fill="url(#stars)"/>
</svg>
